<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Error 502 | Bad gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #fff;
      color: #404040;
      font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .cf-header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 48px 28px;
    }

    .cf-header h1 {
      display: inline;
      font-size: 58px;
      font-weight: 300;
      color: #555;
      line-height: 1.05;
      letter-spacing: -0.4px;
    }

    .heading-ray-id {
      display: inline-block;
      margin-left: 16px;
      font-size: 13px;
      font-weight: 400;
      color: #9a9a9a;
      letter-spacing: 0.2px;
      position: relative;
      top: -16px;
      vertical-align: baseline;
    }

    .cf-subheadline {
      margin-top: 4px;
      font-size: 30px;
      font-weight: 300;
      color: #c4c4c4;
      line-height: 1.2;
    }

    .cf-status-display {
      position: relative;
      background: #e6e6e6;
      padding: 48px 20px 56px;
    }

    .cf-status-row {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .cf-status-item {
      position: relative;
      flex: 1;
      text-align: center;
    }

    .cf-icon-wrap {
      position: relative;
      display: inline-block;
      width: 88px;
      height: 78px;
    }

    .cf-icon-wrap svg.cf-icon {
      display: block;
      width: 88px;
      height: 68px;
    }

    .cf-icon-status {
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 30px;
      height: 30px;
    }

    .cf-icon-status svg {
      display: block;
      width: 32px;
      height: 32px;
    }

    .cf-status-desc {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 400;
      color: #888;
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 10px;
    }

    .cf-status-name {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 300;
      color: #b3b3b3;
      line-height: 1.2;
    }

    .cf-status-label {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
    }

    .cf-status-ok { color: #9bca3e; }
    .cf-status-error { color: #bd2426; }

    .cf-arrow {
      flex: 0 0 100px;
      align-self: flex-start;
      margin-top: 24px;
      color: #9a9a9a;
    }

    .cf-arrow svg {
      display: block;
      width: 100%;
      height: 26px;
    }

    .cf-error-source::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -56px;
      width: 0;
      height: 0;
      margin-left: -18px;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 18px solid #fff;
    }

    .cf-content {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 48px 56px;
      display: flex;
      gap: 56px;
    }

    .cf-column { flex: 1; min-width: 0; }

    .cf-column h2 {
      font-size: 28px;
      font-weight: 300;
      color: #404040;
      margin-bottom: 12px;
    }

    .cf-column p {
      font-size: 15px;
      color: #404040;
      line-height: 1.55;
    }

    @media (max-width: 720px) {
      .cf-header { padding: 22px 20px 18px; }
      .cf-header h1 { display: block; font-size: 40px; }
      .heading-ray-id { display: block; margin: 6px 0 0; top: 0; }
      .cf-subheadline { font-size: 22px; }
      .cf-status-row { flex-direction: column; align-items: center; gap: 28px; }
      .cf-arrow { display: none; }
      .cf-error-source::after { display: none; }
      .cf-content { flex-direction: column; padding: 28px 20px 40px; gap: 28px; }
    }
  </style>
</head>
<body>

  <section class="cf-content">
